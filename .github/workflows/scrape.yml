name: Scrape

# CANONICAL CALLER PATTERN from the Brewtality-3-16 template — do not add
# scrape logic here. Fixes belong in the template's scrape-reusable.yml so
# they reach every derived scraper automatically.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing to the API'
        type: boolean
        default: true

jobs:
  scrape:
    uses: TheTatu13/Brewtality-3-16/.github/workflows/scrape-reusable.yml@v1
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    permissions:
      contents: write
      issues: write
